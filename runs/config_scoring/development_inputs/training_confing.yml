scores_output_interface_option: "MHClassifer2Reg" # "None", "MHClassifer2Reg"
#task_type_y: "regression"  # task_type: Literal["classification","regression"]="regression"   

loss:
  score:
    name: "MSEandCELossSoft"  # FocalLoss  MSELoss  "MSE+CELoss"  "MSEandCELossSoft"
    params: 
      mse_weight: 0.5
      class_weight: 0.5
      nearest_neighbour_label_smoothing: 0.05
      next_nearest_neighbour_label_smoothing: 0.01

#  score:
#    name: CrossEntropyLoss  # FocalLoss  MSELoss  "MSE+CELoss"  ""
#    params: {}


  score_reg:
    name: "MSELoss"
    params: {}

  triplet_scores_classes:
    name: "OnlineBatchAllTripletLossWithScores"     # or OnlineBatchAllTripletLoss
    params:
      margin_offset: 0.2
      margin_scale: 0.1
      metric: "cosine"
      #squared: false          # optional

  triplet_WST_scores:
    name: "OnlineBatchAllTripletLossWithScoresAndSelfTransform"     # or OnlineBatchAllTripletLoss
    params:
      margin_offset: 0.2
      margin_scale: 0.1
      metric: "cosine"
      #squared: false          # optional    

  # triplet_WST_time:
  #   name: "OnlineBatchAllTripletLossWithScoresAndSelfTransform"     # or OnlineBatchAllTripletLoss
  #   params:
  #     margin_offset: 0.1
  #     margin_scale: 0.1
  #     metric: "cosine"
  #     squared: false          # optional    


  score_consistency_regularizer:
    name: "ScoresConsistencyRegularizer"     # or OnlineBatchAllTripletLoss
    params:
      metric_embeddings: "cosine"  # "euclidean", "cosine", "tanh_euclidean"
      # squared_embeddings_metric: True  # Noes nothing for cosine 
      deltino: 0.1





loss_weights:
  lambda_x: !!float 0.0e0 # 1e2  
  lambda_y: !!float 1.0e0 # 1e-0  
  lambda_y_delta: 0.0      # Huber loss for same patient, ... 
  lambda_y_reg_extra: 0.0  # An extra MSE Loss (makes only sense on top of Classification loss)

  lambda_z: !!float 0e-5    
  lambda_z_triplet_classes: 0.0   
  lambda_z_triplet_WST_scores: 0.0   # with old DL not allowed
  lambda_z_score_consistency_regularizer: 0.0 

  

mlflow_runs_dir: /home/cwatzenboeck/data/mlflow_cirpc_tmp/RA/data/
model:
  autoencoder:
    arch: "resnet18"
  classifier:
    name: "MixLogAndReg"  # Reg or LogReg or MixLogAndReg       
    model_dct_keys_to_convert_to_lists: []
    model_kw_requires_import:
    - dropout_op
    - nonlin
    model_params:
      depth: 1
      dropout_op: torch.nn.Dropout
      dropout_op_kwargs.p: 0.0
      hidden_dim: 512
      nonlin: torch.nn.ReLU
      nonlin_kwargs: {}
      norm_op_kwargs: {}
      normalization: layer
  postprocessor_recon:
    name: PostprocessingGrayScaleMaker_v3 # Null #PostprocessingGrayScaleMaker # Null #PostprocessingGrayScaleMaker_v2
    params:
      output_function: "sigmoid" #"sigmoid" #   "None"   # "sigmoid" "relu" "None"
  preprocessor:
    name: ResNetRGBMaker # ResNetRGBMaker  # Null ResNetRGBMaker
  score_type_encoder:
    name: "ROI_type_encoder"  # null  # ROI_type_encoder
  #-.-----------------------  
  score_estimator: # Only used when  MixLogAndReg # Comment out -> Not used
    model_params:
      bias: True  

model_name: "ResNetNoAE + MultiHeadClassifier"



AE_transform: 
  name: GaussianNoiseWithClip #   Null   # GaussianNoiseWithClip, Null 
  GaussianNoise_sigma: !!float 2.0e-05


optimizer_name: "torch.optim.AdamW"

optimizer_params:
  learning_rates:
    # encoder__OR__decoder: 8.164522178527674e-06
    #"auto_encoder.decoders":  !!float 1e-4
    "auto_encoder":  !!float  3.0e-05
    heads: !!float  3.0e-04
    score_estimators: !!float 3.0e-4
  other_optimizer_kwargs:
    weight_decay: !!float 1.0e-3


# scheduler_name: "torch.optim.lr_scheduler.ReduceLROnPlateau"
# scheduler_params:
#    mode: 'min'
#    verbose: True





transforms:
  drop_img_original: False
  ACTIVATE_TRIPLET_TRAINING_TRANSFORMS: True


  # --- output / channels / normalization ---
  OUTPUT_DIM: [128, 128]

  RBG_channels__bool: false
  # Normalize__bool: true
  # Normalize__mean: [0.485, 0.456, 0.406]
  # Normalize__std:  [0.229, 0.224, 0.225]

  # --- geometry (applied per-view before crop) ---
  RandAffined__bool: True
  RandAffined__prob: 0.8
  RandAffined__rotation_range_degree: 10
  RandAffined__translate_range_pixels: 19
  RandAffined__scale_range: 0.1
  RandAffined__shear_range: null   # e.g., [-0.05, 0.05] to enable

  Rand2DElasticd__bool: false
  Rand2DElasticd__prob: 0.2
  Rand2DElasticd__spacing: 12
  Rand2DElasticd__magnitude: 2.73
  # Rand2DElasticd__shear_range: null  # not used in current code path

  # 
  # RandFlipd__bool: false
  # RandFlipd__prob: 0.5

  # --- photometric (per-view, after crop, before final normalize) ---
  RandScaleIntensityd__bool: True
  RandScaleIntensityd__prob: 0.5
  RandScaleIntensityd__factors: [-0.1, 0.1]

  RandShiftIntensityd__bool: True
  RandShiftIntensityd__prob: 0.5
  RandShiftIntensityd__offsets: [-0.1, 0.1]


  RandAdjustContrastd__bool: True
  RandAdjustContrastd__prob: 0.5
  RandAdjustContrastd__gamma: [0.7, 1.5]
  RandAdjustContrastd__invert_image: False

  RandHistogramShiftd__bool: False
  RandHistogramShiftd__prob: 0.5
  RandHistogramShiftd__num_control_points: [5,15]

  # --- blur / noise / occlusion (per-view) ---
  RandGaussianSmoothd__bool: True
  RandGaussianSmoothd__prob: 0.5
  RandGaussianSmoothd__sigma: [0.3, 0.8]

  RandGaussianNoised__bool: True
  RandGaussianNoised__prob: 0.5
  RandGaussianNoised__std: 0.02

  RandCoarseDropoutd__bool: False
  RandCoarseDropoutd__prob: 1.0
  RandCoarseDropoutd__holes: 3
  RandCoarseDropoutd__spatial_size: [8, 8]   # use [8,8,4] for 3D
  RandCoarseDropoutd__fill_value: 0.0  

  Clamp01__bool: true  
