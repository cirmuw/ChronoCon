    - dropout_op
    - nonlin
    model_params:
      fixed_parameters:
        #depth: 1
        dropout_op: torch.nn.Dropout
        dropout_op_kwargs.p: 0.0
        #hidden_dim: 512
        #nonlin: torch.nn.ReLU
        nonlin_kwargs: {}
        norm_op_kwargs: {}
        normalization: layer
      optuna_hp_ranges:
        - type: "suggest_int"
          params:
            name: "hidden_dim"
            low: 32
            high: 512
            step: 16
        - type: "suggest_int"
          params:
            name: "depth"
            low: 0
            high: 6           
        - type: "suggest_categorical"
          params: 
            name: "nonlin"
            choices:
              - "torch.nn.ReLU"
              - "torch.nn.GELU"
