    params:
      output_function: "sigmoid" #"sigmoid" #   "None"   # "sigmoid" "relu" "None"
  preprocessor:
    name: ResNetRGBMaker # ResNetRGBMaker  # Null ResNetRGBMaker
  score_type_encoder:
    fixed_parameters: {}
    optuna_hp_ranges:
      - type: "suggest_categorical"
        params: 
          name: "name"
          choices:
            - Null
            - ROI_type_encoder
            
    #name: ROI_type_encoder #"ROI_type_encoder"  # null  # ROI_type_encoder   # -> In this specific case not necessary ... One head per type!
  score_estimator: # Only used when  MixLogAndReg # Comment out -> Not used
    model_params:
      bias: True  

 
