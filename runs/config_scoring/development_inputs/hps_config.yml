training:
  fixed_parameters:
    USE_GROUPED_VALIDATION_LOADER: False  # "WARINING I fUSE_GROUPED_VALIDATION_LOADER=True  the metrics might not be comparible! "  )

    batch_size: 100
    early_stopping_tol: 5
    epochs: 25
    num_workers: 8 #12

    persistent_workers:  False
    pin_memory: False
    batch_size_dependent_lr: True

    sampler_settings:
      group_identifiers: ["patient_id", "score_type", "left_or_right"]
      target_col: "score"
      group_score_agg: "mean_ceil"     # ceil(mean(score) over visits) → group label

      # group-level oversampling
      prior_mode: "uniform"            # enforce near-uniform over score_type
      weight_mode: "inverse_freq"      # balance label distribution across groups
      alpha: 1.0                       # 0=no balancing, 1=full inverse-frequency
      epsilon: 1.0                     # smoothing for label counts
      prior_per_label: null            # optional {label:int -> prior:float} to tilt weights

      size_correction: False   # 

      # batching behavior
      group_replacement: true          # allow re-using a group across batches within an epoch
      drop_last: false
      seed: 0

  optuna_hp_ranges:
    - type: "suggest_categorical"
      params:
        name: "sampler_name"
        choices:
          - Null
          - "WeightedRandomSampler" 
          - "GroupLevelTypePriorBatchSampler"
#          - "PatientLevelWeightedRandomSampler"





