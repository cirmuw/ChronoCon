scores_output_interface_option: "MHClassifer2Reg" # "None", "MHClassifer2Reg"

loss: 
  score: 
    name: "MSEandCELossSoft"
    params: 
      fixed_parameters:
        mse_weight: 0.5
        class_weight: 0.5
      optuna_hp_ranges: 
        - type: "suggest_float"
          params: 
            name: "nearest_neighbour_label_smoothing"
            low: 0.0
            high: 0.1
        - type: "suggest_float"
          params: 
            name: "next_nearest_neighbour_label_smoothing"
            low: 0.0
            high: 0.05



  score_reg:
    name: "MSELoss"
    params: {}

  triplet_scores_classes:
    name: "OnlineBatchAllTripletLossWithScores"     # or OnlineBatchAllTripletLoss
    params:
      fixed_parameters:
        metric: "cosine"
      optuna_hp_ranges:       
        - type: "suggest_float"
          params: 
            name: "margin_offset"
            low: 0.0
            high: 1.5
        - type: "suggest_float"
          params: 
            name: "margin_scale"
            low: 0.0
            high: 0.3


  triplet_WST_scores:
    name: "OnlineBatchAllTripletLossWithScoresAndSelfTransform"     # or OnlineBatchAllTripletLoss
    params:
      fixed_parameters:
        metric: "cosine"
      optuna_hp_ranges:       
        - type: "suggest_float"
          params: 
            name: "margin_offset"
            low: 0.0
            high: 1.5
        - type: "suggest_float"
          params: 
            name: "margin_scale"
            low: 0.0
            high: 0.3



  score_consistency_regularizer:
    name: "ScoresConsistencyRegularizer"     # or OnlineBatchAllTripletLoss
    params:
      fixed_parameters: 
        metric_embeddings: "cosine"
      optuna_hp_ranges:       
        - type: "suggest_float"
          params: 
            name: "deltino"
            low: 0.01
            high: 1

  triplet_MDP:  # Monoton disease progression
    name: "OnlineBatchAllTripletLossMDPForward"     # or OnlineBatchAllTripletLoss
    params:
      fixed_parameters: 
        #margin_offset: 0.0
        metric: "cosine"     
      optuna_hp_ranges:       
        - type: "suggest_float"
          params: 
            name: "margin_offset"
            low: 0.0
            high: 0.2
        - type: "suggest_categorical"
          params:
            name: "score_direction"
            choices:
              - "ignore"
              - "decrease"
              - "ignore"



  RnC_time:
    name: "RnC_time"     # or OnlineBatchAllTripletLoss
    params:
      fixed_parameters: 
        #feature_sim: "cosine"  # "cosine" or "l2"
        label_diff: "scalar difference"  # "l1" or "scalar difference"
        ignore_ids: False  # For ablation study and tests
      optuna_hp_ranges:       
        - type: "suggest_float"
          params: 
            name: "temperature"
            low: 0.1
            high: 5
        - type: "suggest_categorical"
          params:
            name: "feature_sim"
            choices:
              - "cosine"
              - "l2" 

  RnC_score:
    name: "RnC_score"     # or OnlineBatchAllTripletLoss
    params:
      fixed_parameters: {}
        #feature_sim: "cosine"  # "cosine" or "l2"
        #label_diff: "scalar difference"  # "l1" or "scalar difference"
        #ignore_ids: False  # For ablation study and tests
      optuna_hp_ranges:       
        - type: "suggest_float"
          params: 
            name: "temperature"
            low: 0.1
            high: 5
        - type: "suggest_categorical"
          params:
            name: "feature_sim"
            choices:
              - "cosine"
              - "l2" 
        - type: "suggest_categorical"
          params:
            name: "label_diff"
            choices:
              - "scalar difference"
              - "l1" 
        - type: "suggest_categorical"
          params:
            name: "ignore_ids"
            choices:
              - True
              - False               




