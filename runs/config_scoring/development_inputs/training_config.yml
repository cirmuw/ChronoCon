training:


  USE_GROUPED_VALIDATION_LOADER: True  # "WARINING I fUSE_GROUPED_VALIDATION_LOADER=True  the metrics might not be comparible! And losses certainly not. "  )

  batch_size: 100 #512


  save_regularly: True
  save_regularly_freq: 10
  run_full_epochs: False

  early_stopping_tol: 10 # 5
  #early_stopping_metric_key: "L"  # default "L" -> loss  options: ....
  #early_stopping_metric_direction: "min"   # default is min  # options:  min or max
  #extract_ES_metric_from_validation_metrics_dct_OPTION: Null # None is default,   classification_report.macro avg

  # early_stopping_metric_key: "f1-score"  # default "L" -> loss  options: ....
  # early_stopping_metric_direction: "max"   # default is min  # options:  min or max
  # extract_ES_metric_from_validation_metrics_dct_OPTION: "classification_report.macro avg" # None is default,   classification_report.macro avg

  # early_stopping_metric_key: "rmse"  # default "L" -> loss  options: ....
  # early_stopping_metric_direction: "min"   # default is min  # options:  min or max
  # extract_ES_metric_from_validation_metrics_dct_OPTION: Null # "classification_report.macro avg" # None is default,   classification_report.macro avg

  # early_stopping_metric_key: "mae"  # default "L" -> loss  options: ....
  # early_stopping_metric_direction: "min"   # default is min  # options:  min or max
  # extract_ES_metric_from_validation_metrics_dct_OPTION: Null # "classification_report.macro avg" # None is default,   classification_report.macro avg



  epochs: 2
  num_workers: 8 #12

  persistent_workers:  False
  pin_memory: False
  batch_size_dependent_lr: True

  # sampler_name: WeightedRandomSampler    # ok 

  # sampler_name : PatientLevelWeightedRandomSampler  is not advised

  # This sampler has the purpose that all images for Patient001_Left_PIPIIJSN are kept in same batch 
  # 

  sampler_name: "GroupLevelTypePriorBatchSampler"
  # Fixed issue of  GroupLevelWeightedBatchSampler
  # Seems however that some score disballance remains. Maybe because for some score_types I have reduced score range. 
  # (Not a single example with max score -> Can not oversample but ok)  
  sampler_settings:
    group_identifiers: ["patient_id", "score_type", "left_or_right"]
    target_col: "score"
    group_score_agg: "mean_ceil"     # ceil(mean(score) over visits) → group label

    # group-level oversampling
    prior_mode: "uniform"            # enforce near-uniform over score_type
    weight_mode: "inverse_freq"      # balance label distribution across groups
    alpha: 1.0                       # 0=no balancing, 1=full inverse-frequency
    epsilon: 1.0                     # smoothing for label counts
    prior_per_label: null            # optional {label:int -> prior:float} to tilt weights

    size_correction: False   # 

    # batching behavior
    group_replacement: true          # allow re-using a group across batches within an epoch
    drop_last: false
    seed: 0



  
  #sampler_name: PatientLevelWeightedRandomSampler #  GroupedWeightedRandomSampler  #PatientLevelWeightedRandomSampler  # WeightedRandomSampler  PatientLevelWeightedRandomSampler

  # sampler_name: "GroupedWeightedRandomSampler"  # TwoStageGroupedWeightedRandomBatchSampler  WeightedRandomSampler
  # sampler_settings: 
  #   #batch_size: 64
  #   replacement: true
  #   min_primary_fraction: 0.7
  #   max_groups_per_batch: 3
  #   min_primary_items: 2          # optional, stronger than the fraction
  #   repeats_per_group_cap: 1       # optional, avoid over-repeating individuals in one batch
  #   group_identifiers: ["patient_id","score_type","left_or_right"]
  #   target_col: "score"
  #   group_score_agg: "mean_ceil"


  # Potential issues: 
  # Class dis-ballance in scores can lead to score_type dis-ballance 
  # 
  # sampler_name: "GroupLevelWeightedBatchSampler"
  # sampler_settings:
  #   group_identifiers: ["patient_id", "score_type", "left_or_right"]
  #   target_col: "score"
